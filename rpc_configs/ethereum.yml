# Param names: used to convert JSON-RPC by-name (object) params to positions.
# `aliases` lists the node's own argument names where they differ (Frontier
# client/rpc-core, as vendored in subtensor mainnet). The snake_case and
# camelCase forms of every name are accepted too. tests/node_param_names.json
# pins the node's names; see config/node_names_test.rs.
methods:
  - method: eth_blockNumber
    cache:
      ttl_seconds: 1

  - method: eth_chainId
    cache:
      size: 1

  - method: eth_protocolVersion

  - method: eth_syncing

  - method: eth_coinbase

  - method: eth_gasPrice

  - method: eth_accounts

  - method: net_version
    cache:
      size: 1

  - method: net_runtimeVersion
    cache:
      size: 1

  - method: net_health

  - method: net_isSafeMode
    cache:
      size: 1

  - method: net_indexer

  - method: web3_clientVersion
    cache:
      size: 1

  - method: eth_sign
    params:
      - name: address
        ty: String
      - name: message
        ty: String

  - method: eth_sendTransaction
    cache:
      size: 0
    params:
      - name: Transaction
        ty: Bytes
        aliases: [ request ]

  - method: eth_sendRawTransaction
    cache:
      size: 0
    params:
      - name: transaction
        ty: Bytes
        aliases: [ bytes ]

  - method: eth_call
    cache:
      ttl_seconds: 3
    params:
      - name: transaction
        ty: Bytes
        aliases: [ request ]
      - name: block
        ty: BlockTag
        optional: true
        aliases: [ number_or_hash ]
      - name: stateOverrides
        ty: StateOverrides
        optional: true

  - method: eth_getTransactionCount
    cache:
      ttl_seconds: 3
    params:
      - name: address
        ty: Bytes
      - name: block
        ty: BlockHash
        aliases: [ number_or_hash ]

  - method: eth_getBlockByHash
    params:
      - name: BlockHash
        ty: BlockHash
        aliases: [ hash ]
      - name: FullTransactions
        ty: Boolean
        aliases: [ full ]

  - method: eth_getBlockByNumber
    params:
      - name: blockTag
        ty: BlockTag
        inject: true
        aliases: [ number_or_hash ]
      - name: fullTransactions
        ty: Boolean
        aliases: [ full ]

  - method: eth_getBlockTransactionCountByHash
    params:
      - name: BlockHash
        ty: BlockHash
        aliases: [ hash ]

  - method: eth_getBlockTransactionCountByNumber
    params:
      - name: blockTag
        ty: BlockTag
        inject: true
        aliases: [ number_or_hash ]

  - method: eth_getUncleCountByBlockHash
    params:
      - name: BlockHash
        ty: BlockHash
        aliases: [ hash ]

  - method: eth_getUncleCountByBlockNumber
    params:
      - name: blockTag
        ty: BlockTag
        inject: true
        aliases: [ number_or_hash ]

  - method: eth_estimateGas
    cache:
      ttl_seconds: 3
    params:
      - name: transaction
        ty: Bytes
        aliases: [ request ]
      - name: block
        ty: BlockTag
        optional: true
        aliases: [ number_or_hash ]

  - method: eth_feeHistory
    params:
      - name: blockCount
        ty: Bytes
      - name: newestBlock
        ty: boolean
      - name: rewardPercentiles
        ty: Bytes

  - method: eth_getUncleByBlockHashAndIndex
    params:
      - name: blockHash
        ty: BlockHash
        aliases: [ hash ]
      - name: hexNumber
        ty: Bytes
        aliases: [ index ]

  - method: eth_getUncleByBlockNumberAndIndex
    params:
      - name: block
        ty: BlockTag
        inject: true
        aliases: [ number_or_hash ]
      - name: hexNumber
        ty: Bytes
        aliases: [ index ]

  - method: eth_isBlockFinalized
    cache:
      ttl_seconds: 3
    params:
      - name: block
        ty: BlockTag
        inject: true

  - method: eth_isTransactionFinalized
    cache:
      ttl_seconds: 3
    params:
      - name: transactionHash
        ty: Bytes

  - method: eth_newFilter
    cache:
      size: 0
    params:
      - name: Filter
        ty: Bytes

  - method: eth_newBlockFilter
    cache:
      size: 0

  - method: eth_newPendingTransactionFilter
    cache:
      size: 0

  - method: eth_getFilterChanges
    cache:
      size: 0
    params:
      - name: address
        ty: Bytes
        aliases: [ index ]

  - method: eth_getFilterLogs
    cache:
      size: 0
    params:
      - name: address
        ty: Bytes
        aliases: [ index ]

  - method: eth_uninstallFilter
    cache:
      size: 0
    params:
      - name: FilterIdentifier
        ty: Bytes
        aliases: [ index ]

  - method: eth_getLogs
    cache:
      size: 0
    params:
      - name: Filter
        ty: Bytes

  - method: eth_getBalance
    params:
      - name: Address
        ty: Bytes
      - name: Block
        ty: BlockTag
        inject: true
        aliases: [ number_or_hash ]

  - method: eth_getStorageAt
    params:
      - name: address
        ty: Bytes
      - name: position
        ty: Bytes
        aliases: [ index ]
      - name: block
        ty: BlockTag
        inject: true
        aliases: [ number_or_hash ]

  - method: eth_getCode
    params:
      - name: Address
        ty: Bytes
      - name: Block
        ty: BlockTag
        inject: true
        aliases: [ number_or_hash ]

  - method: eth_getTransactionByHash
    params:
      - name: transactionHash
        ty: Bytes
        aliases: [ hash ]

  - method: eth_getTransactionByBlockHashAndIndex
    params:
      - name: BlockHash
        ty: BlockHash
        aliases: [ hash ]
      - name: TransactionIndex
        ty: Bytes
        aliases: [ index ]

  - method: eth_getTransactionByBlockNumberAndIndex
    params:
      - name: blockTag
        ty: BlockTag
        inject: true
        aliases: [ number_or_hash ]
      - name: transactionIndex
        ty: HexNumber
        aliases: [ index ]

  - method: eth_getEthGas
    params:
      - name: substrateGasParams
        ty: Bytes

  - method: eth_getEthResources
    params:
      - name: transaction
        ty: Bytes

  - method: eth_getTransactionReceipt
    params:
      - name: txHash
        ty: Bytes
        aliases: [ hash ]

subscriptions:
  - subscribe: eth_subscribe
    unsubscribe: eth_unsubscribe
    name: eth_subscription
    params:
      - name: kind
        ty: String
      - name: params
        ty: Object
        optional: true
